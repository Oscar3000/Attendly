# Throwaway Postgres for tests: npm run test:db:up / npm run test:db:down
# Data lives in memory (tmpfs) and is lost when the container stops

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: attendly-postgres-test
    environment:
      POSTGRES_DB: attendly_test
      POSTGRES_USER: attendly_test
      POSTGRES_PASSWORD: attendly_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendly_test -d attendly_test"]
      interval: 2s
      timeout: 5s
      retries: 15
